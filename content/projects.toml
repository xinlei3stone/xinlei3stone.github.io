title = "Electrochemistry Data QA Assistant"
subtitle = "Personal project · in progress"
date = "2026"
content = '''
**Goal.** Ask questions in natural language over my own thesis data and get answers that cite the underlying records — not a plausible-sounding guess.

**Plan.** Local Qwen via Ollama, pgvector retrieval over experiment notes and instrument outputs, and NL2SQL over structured process data. The same pattern as retrieval over SOP, case, and defect records in a fab.

**Status.** Architecture defined; build starts after the statistics, SQL, and RAG fundamentals are in place.
'''
